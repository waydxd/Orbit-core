services:
  postgres:
    image: postgres:18-alpine
    # No DB credentials or mounted TLS certs — running with default postgres user and no SSL certs
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: orbit
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4-alpine
    # Removed port mapping - redis should only be accessible within Docker network
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf
    command: /bin/sh -c "redis-server /usr/local/etc/redis/redis.conf"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:latest
    # Removed port mapping - mongo should only be accessible within Docker network
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  orbit-orbi:
    image: ghcr.io/waydxd/orbit-orbi:latest
    tty: true
    ports:
      - "50042:50042"
    env_file: .env
    environment:
      CALENDAR_SERVICE_ADDR: ${CALENDAR_SERVICE_ADDR:-orbit-core:50052}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://hkust.azure-api.net/}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  orbit-core:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    expose:
      - "50052"
    env_file: .env
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-}
      # DB_USER/DB_PASSWORD were previously provided via Docker secrets in prod; now omitted for local/dev
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      # MONGO_INITDB_ROOT_USERNAME/PASSWORD intentionally removed to run Mongo without auth
      ORBI_HOST: ${ORBI_HOST:-orbit-orbi}
      ORBI_PORT: ${ORBI_PORT:-50042}
      GRPC_SERVER_PORT: ${GRPC_SERVER_PORT:-50052}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      PASSWORD_RESET_EXPIRY_MINUTES: ${PASSWORD_RESET_EXPIRY_MINUTES:-30}
      EMAIL_VERIFICATION_EXPIRY_HOURS: ${EMAIL_VERIFICATION_EXPIRY_HOURS:-24}
      EMAIL_FROM: ${EMAIL_FROM:-"Orbit <onboarding@orbitly.qzz.io>"}
    volumes:
      - ./migrations:/root/migrations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      orbit-orbi:
        condition: service_healthy


volumes:
  postgres_data:
  redis_data:
  mongo_data:
