services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-orbit}
    # Mount TLS certs (for testing, generate self-signed cert/key into ./secrets/postgres_server.crt and ./secrets/postgres_server.key)
    volumes:
      - ./secrets/postgres_server.crt:/var/lib/postgresql/server.crt:ro
      - ./secrets/postgres_server.key:/var/lib/postgresql/server.key:ro
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/migrations
    # Start Postgres with SSL enabled and point to the mounted cert/key
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/var/lib/postgresql/server.crt", "-c", "ssl_key_file=/var/lib/postgresql/server.key"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/db_user)" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4-alpine
    # Removed port mapping - redis should only be accessible within Docker network
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: /bin/sh -c "redis-server /usr/local/etc/redis/redis.conf --requirepass \"${REDIS_PASSWORD}\""
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:latest
    # Removed port mapping - mongo should only be accessible within Docker network
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  orbit-orbi:
    image: ghcr.io/waydxd/orbit-orbi:latest
    tty: true
    ports:
      - "50042:50042"
    env_file: .env
    environment:
      CALENDAR_SERVICE_ADDR: ${CALENDAR_SERVICE_ADDR:-orbit-core:50052}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://hkust.azure-api.net/}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  orbit-core:
    build:
      context: .
      dockerfile: Dockerfile
      # Removed public port mappings - access via nginx reverse proxy
    expose:
      - "8080"
      - "50052"
    env_file: .env
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-}
      # DB_USER/DB_PASSWORD/DB_NAME were previously provided via Docker secrets in prod; now passed via env
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-}
      ORBI_HOST: ${ORBI_HOST:-orbit-orbi}
      ORBI_PORT: ${ORBI_PORT:-50042}
      GRPC_SERVER_PORT: ${GRPC_SERVER_PORT:-50052}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      PASSWORD_RESET_EXPIRY_MINUTES: ${PASSWORD_RESET_EXPIRY_MINUTES:-30}
      EMAIL_VERIFICATION_EXPIRY_HOURS: ${EMAIL_VERIFICATION_EXPIRY_HOURS:-24}
      EMAIL_FROM: ${EMAIL_FROM:-"Orbit <onboarding@orbitly.qzz.io>"}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      orbit-orbi:
        condition: service_healthy
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - orbit-core
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    entrypoint: ["/bin/sh", "-c"]
    command: >
      user=$${DB_USER:-postgres}; \
      pass=$${DB_PASSWORD:-postgres}; \
      db=$${DB_NAME:-orbit}; \
      until pg_isready -U "$$user" -h postgres >/dev/null 2>&1; do echo "Waiting for Postgres to be ready..."; sleep 1; done; \
        migrate -path=/migrations/ -database="postgres://$$user:$$pass@postgres:5432/$$db?sslmode=require" up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  mongo_data:

