version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: orbit-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orbit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orbit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  orbit-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orbit-core
    ports:
      - "8080:8080"
      - "50054:50054"
    environment:
      SERVER_PORT: 8080
      SERVER_HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: orbit
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      JWT_SECRET: change-this-in-production
      JWT_EXPIRATION_HOURS: 24
      GRPC_SERVER_PORT: 50054
      HASHTAG_ENABLED: true
      HASHTAG_GRPC_HOST: orbit-hashtag
      HASHTAG_GRPC_PORT: 50051
      HASHTAG_GRPC_TIMEOUT: 5
      HASHTAG_GRPC_MAX_RETRIES: 3
      HASHTAG_GRPC_KEEP_ALIVE: 30
      HASHTAG_GRPC_KEEP_ALIVE_TIMEOUT: 10
      HASHTAG_CACHE_ENABLED: true
      HASHTAG_CACHE_TTL: 5
      HASHTAG_CACHE_MAX_SIZE: 1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orbit-hashtag:
        condition: service_started

  orbit-hashtag:
    image: waydxd/orbit-hashtag:latest
    container_name: orbit-hashtag
    ports:
      - "50051:50051"
      - "8000:8000"
    environment:
      GRPC_PORT: 50051
      HTTP_PORT: 8000
      MODEL_PATH: /app/models
      DEVICE: cpu
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "localhost:50051", "hashtag.HashtagService/HealthCheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
