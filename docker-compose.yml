services:
  postgres:
    image: postgres:18-alpine
    container_name: orbit-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orbit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orbit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:latest
    container_name: orbit-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  orbit-orbi:
    image: ghcr.io/waydxd/orbit-orbi:latest
    container_name: orbit-orbi
    stdin_open: true
    tty: true
    ports:
      - "50042:50042"
    environment:
      OPENAI_API_KEY: "638e2a9d26c74b66877c89bb883fd2f4"
      CALENDAR_SERVICE_ADDR: "orbit-core:50052"
      OPENAI_MODEL: "gpt-4o-mini"
      OPENAI_BASE_URL: "https://hkust.azure-api.net/"
      REDIS_ADDR: "redis:6379"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  orbit-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orbit-core
    ports:
      - "8080:8080"
      - "50052:50052"
    environment:
      SERVER_PORT: 8080
      SERVER_HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: orbit
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      JWT_SECRET: change-this-in-production
      JWT_EXPIRATION_HOURS: 24
      MONGODB_URI: mongodb://mongo:27017
      ORBI_HOST: orbit-orbi
      ORBI_PORT: 50042
      GRPC_SERVER_PORT: 50052
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      orbit-orbi:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
  mongo_data:
