services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_DB_FILE: /run/secrets/db_name
    # Mount TLS certs (generate using `make postgres-gen-cert` for testing)
    volumes:
      - ./secrets/postgres_server.crt:/var/lib/postgresql/server.crt:ro
      - ./secrets/postgres_server.key:/var/lib/postgresql/server.key:ro
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/migrations
    # Start Postgres with SSL enabled and point to the mounted cert/key
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/var/lib/postgresql/server.crt", "-c", "ssl_key_file=/var/lib/postgresql/server.key"]
    secrets:
      - db_user
      - db_password
      - db_name
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/db_user)"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4-alpine
    # Removed port mapping - redis should only be accessible within Docker network
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf
    secrets:
      - redis_password
    command: /bin/sh -c "redis-server /usr/local/etc/redis/redis.conf --requirepass \"$(cat /run/secrets/redis_password)\""
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$(cat /run/secrets/redis_password)\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:latest
    # Removed port mapping - mongo should only be accessible within Docker network
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_user
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    secrets:
      - mongo_user
      - mongo_password
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  orbit-orbi:
    image: ghcr.io/waydxd/orbit-orbi:latest
    tty: true
    ports:
      - "50042:50042"
    env_file: .env
    environment:
      CALENDAR_SERVICE_ADDR: ${CALENDAR_SERVICE_ADDR:-orbit-core:50052}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://hkust.azure-api.net/}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
    secrets:
      - openai_api_key
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  orbit-core:
    build:
      context: .
      dockerfile: Dockerfile
      # Removed public port mappings - access via nginx reverse proxy
    expose:
      - "8080"
      - "50052"
    env_file: .env
    secrets:
      - jwt_secret
      - resend_api_key
      - db_user
      - db_password
      - db_name
      - mongo_user
      - mongo_password
      - redis_password
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      # DB_USER/DB_PASSWORD/DB_NAME are provided via Docker secrets in prod.
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # REDIS_PASSWORD is a secret; provided via Docker secrets in prod if required.
      REDIS_DB: ${REDIS_DB:-0}
      # JWT_SECRET and other API keys are provided via Docker secrets in prod.
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      ORBI_HOST: ${ORBI_HOST:-orbit-orbi}
      ORBI_PORT: ${ORBI_PORT:-50042}
      GRPC_SERVER_PORT: ${GRPC_SERVER_PORT:-50052}
      # RESEND_API_KEY is a secret; provided via Docker secrets in prod.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      PASSWORD_RESET_EXPIRY_MINUTES: ${PASSWORD_RESET_EXPIRY_MINUTES:-30}
      EMAIL_VERIFICATION_EXPIRY_HOURS: ${EMAIL_VERIFICATION_EXPIRY_HOURS:-24}
      EMAIL_FROM: ${EMAIL_FROM:-"Orbit <onboarding@orbitly.qzz.io>"}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      orbit-orbi:
        condition: service_healthy
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - orbit-core
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    secrets:
      - db_user
      - db_password
      - db_name
    entrypoint: ["/bin/sh", "-c"]
    command: >
      user=$$(cat /run/secrets/db_user 2>/dev/null || echo postgres); \
      pass=$$(cat /run/secrets/db_password 2>/dev/null || echo postgres); \
      db=$$(cat /run/secrets/db_name 2>/dev/null || echo orbit); \
      until pg_isready -U "$$user" -h postgres >/dev/null 2>&1; do echo "Waiting for Postgres to be ready..."; sleep 1; done; \
        migrate -path=/migrations/ -database="postgres://$$user:$$pass@postgres:5432/$$db?sslmode=require" up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Development Vault server (optional, used to centrally store secrets)
