openapi: 3.0.3
info:
  title: Orbit Core API
  description: A comprehensive personal productivity API with calendar, tasks, location tracking, and integration capabilities
  version: 1.0.0
  contact:
    name: Orbit Core Team
servers:
  - url: http://localhost:8080
    description: Development server

paths:
  /health:
    get:
      summary: Health check endpoint
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: gateway

  /api/v1/auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: user registered successfully
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to generate token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/verify:
    post:
      summary: Verify JWT token
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
        '401':
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout:
    post:
      summary: Logout user
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: logged out successfully
        '400':
          description: No token provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid session or token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/password-reset-request:
    post:
      summary: Request a password reset link
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: If the email exists, a reset link has been sent (always returns success to avoid enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: if the email exists, a reset link has been sent
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/password-reset-confirm:
    post:
      summary: Confirm password reset with token and new password
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.reset-token
                password:
                  type: string
                  format: password
                  example: newsecurepassword123
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: password reset successfully
        '400':
          description: Invalid or expired token / invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/verify-email:
    get:
      summary: Verify email using token from email link
      tags:
        - Authentication
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Verification token sent in email link
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: email verified successfully
        '400':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found for token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/calendar/events:
    get:
      summary: List all events
      tags:
        - Calendar
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
    post:
      summary: Create a new event
      tags:
        - Calendar
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/calendar/events/{id}:
    get:
      summary: Get event by ID
      tags:
        - Calendar
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Event ID
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
    put:
      summary: Update event
      tags:
        - Calendar
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Event ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '200':
          description: Event updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete event
      tags:
        - Calendar
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Event ID
      responses:
        '204':
          description: Event deleted successfully

  /api/v1/calendar/tasks:
    get:
      summary: List all tasks
      tags:
        - Tasks
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: Create a new task
      tags:
        - Tasks
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/calendar/tasks/{id}:
    get:
      summary: Get task by ID
      tags:
        - Tasks
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Task ID
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
    put:
      summary: Update task
      tags:
        - Tasks
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Task ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete task
      tags:
        - Tasks
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Task ID
      responses:
        '204':
          description: Task deleted successfully

  /api/v1/location/track:
    post:
      summary: Track user location
      tags:
        - Location
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '201':
          description: Location tracked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: location tracked successfully
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/location/history:
    get:
      summary: Get location history for a user
      tags:
        - Location
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: User ID
      responses:
        '200':
          description: Location history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        '400':
          description: Missing user_id parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/location/current:
    get:
      summary: Get current location for a user
      tags:
        - Location
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: User ID
      responses:
        '200':
          description: Current location
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                  latitude:
                    type: number
                    format: double
                  longitude:
                    type: number
                    format: double
        '400':
          description: Missing user_id parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/location/nearby:
    get:
      summary: Find nearby locations/places
      tags:
        - Location
      security:
        - BearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
          description: Latitude
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
          description: Longitude
      responses:
        '200':
          description: Nearby locations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Missing lat or lng parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/integration/sync:
    post:
      summary: Synchronize data between external APIs
      tags:
        - Integration
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: Sync completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: sync completed
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/integration/webhooks:
    post:
      summary: Handle incoming webhooks from external services
      tags:
        - Integration
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Webhook processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: webhook processed
        '400':
          description: Invalid webhook payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/integration/external/connect:
    post:
      summary: Connect to an external API service
      tags:
        - Integration
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalConnectRequest'
      responses:
        '200':
          description: External service connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: external service connected
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/integration/external/disconnect:
    post:
      summary: Disconnect from an external API service
      tags:
        - Integration
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalDisconnectRequest'
      responses:
        '200':
          description: External service disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: external service disconnected
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/integration/external/status:
    get:
      summary: Get status of external integrations
      tags:
        - Integration
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Integration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  integrations:
                    type: array
                    items:
                      type: object

  /api/v1/chat/messages:
    post:
      summary: Send a chat message to the AI assistant
      tags:
        - Chat
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMessageRequest'
      responses:
        '200':
          description: Message processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostMessageResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

  /api/v1/chat/conversations/{conversation_id}:
    get:
      summary: Get conversation history and pending actions
      tags:
        - Chat
      security:
        - BearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
          description: Conversation ID
      responses:
        '200':
          description: Conversation retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

  /api/v1/chat/actions/{action_id}:
    get:
      summary: Get pending action details
      tags:
        - Chat
      security:
        - BearerAuth: []
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
          description: Action ID
      responses:
        '200':
          description: Action details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '404':
          description: Action not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

  /api/v1/chat/actions/{action_id}/confirm:
    post:
      summary: Confirm and execute a pending action
      tags:
        - Chat
      security:
        - BearerAuth: []
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
          description: Action ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmActionRequest'
      responses:
        '200':
          description: Action executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmActionResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '404':
          description: Action not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '409':
          description: Action already processed or not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '410':
          description: Action expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

  /api/v1/chat/actions/{action_id}/cancel:
    post:
      summary: Cancel a pending action
      tags:
        - Chat
      security:
        - BearerAuth: []
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
          description: Action ID
      responses:
        '200':
          description: Action cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Action cancelled successfully
        '404':
          description: Action not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '409':
          description: Action cannot be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

  /api/v1/chat/metrics:
    get:
      summary: Get chat service metrics
      tags:
        - Chat
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_messages:
                    type: integer
                  total_conversations:
                    type: integer
                  total_pending_actions:
                    type: integer
                  total_confirmed_actions:
                    type: integer
                  total_cancelled_actions:
                    type: integer
                  total_expired_actions:
                    type: integer
                  total_failed_actions:
                    type: integer
                  avg_message_latency_ms:
                    type: integer
                  avg_action_latency_ms:
                    type: integer
                  confirmation_rate_pct:
                    type: number
                  success_rate_pct:
                    type: number
                  total_errors:
                    type: integer
                  validation_errors:
                    type: integer
                  policy_violations:
                    type: integer
                  conflict_errors:
                    type: integer
                  messages_per_minute:
                    type: number
                  actions_per_minute:
                    type: number

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from the login endpoint

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: securepassword123

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: securepassword123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          type: object
          properties:
            id:
              type: string
              example: user-123
            email:
              type: string
              example: user@example.com

    Event:
      type: object
      properties:
        id:
          type: string
          example: event-1
        user_id:
          type: string
          example: user-123
        title:
          type: string
          example: Team Meeting
        description:
          type: string
          example: Weekly sync meeting
        start_time:
          type: string
          format: date-time
          example: 2024-01-15T10:00:00Z
        end_time:
          type: string
          format: date-time
          example: 2024-01-15T11:00:00Z
        location:
          type: string
          example: Conference Room A
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EventInput:
      type: object
      required:
        - user_id
        - title
        - start_time
        - end_time
      properties:
        user_id:
          type: string
          example: user-123
        title:
          type: string
          example: Team Meeting
        description:
          type: string
          example: Weekly sync meeting
        start_time:
          type: string
          format: date-time
          example: 2024-01-15T10:00:00Z
        end_time:
          type: string
          format: date-time
          example: 2024-01-15T11:00:00Z
        location:
          type: string
          example: Conference Room A

    Task:
      type: object
      properties:
        id:
          type: string
          example: task-1
        user_id:
          type: string
          example: user-123
        title:
          type: string
          example: Complete project documentation
        description:
          type: string
          example: Write comprehensive docs
        due_date:
          type: string
          format: date-time
          example: 2024-01-20T17:00:00Z
        completed:
          type: boolean
          example: false
        priority:
          type: string
          enum: [low, medium, high]
          example: high
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskInput:
      type: object
      required:
        - user_id
        - title
        - due_date
      properties:
        user_id:
          type: string
          example: user-123
        title:
          type: string
          example: Complete project documentation
        description:
          type: string
          example: Write comprehensive docs
        due_date:
          type: string
          format: date-time
          example: 2024-01-20T17:00:00Z
        priority:
          type: string
          enum: [low, medium, high]
          example: high

    Location:
      type: object
      properties:
        id:
          type: string
          example: loc-1
        user_id:
          type: string
          example: user-123
        latitude:
          type: number
          format: double
          example: 22.3193
        longitude:
          type: number
          format: double
          example: 114.1694
        address:
          type: string
          example: Hong Kong University of Science and Technology
        timestamp:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    LocationRequest:
      type: object
      required:
        - user_id
        - latitude
        - longitude
      properties:
        user_id:
          type: string
          example: user-123
        latitude:
          type: number
          format: double
          example: 22.3193
        longitude:
          type: number
          format: double
          example: 114.1694
        address:
          type: string
          example: Hong Kong University of Science and Technology

    SyncRequest:
      type: object
      required:
        - source
        - target
      properties:
        source:
          type: string
          example: google-calendar
        target:
          type: string
          example: orbit-calendar
        data:
          type: object
          additionalProperties: true

    ExternalConnectRequest:
      type: object
      required:
        - service
        - api_key
      properties:
        service:
          type: string
          example: google-calendar
        api_key:
          type: string
          example: your-api-key

    ExternalDisconnectRequest:
      type: object
      required:
        - service
      properties:
        service:
          type: string
          example: google-calendar

    Error:
      type: object
      properties:
        error:
          type: string
          example: invalid request

    # Chat Service Schemas
    PostMessageRequest:
      type: object
      required:
        - message
        - user_id
      properties:
        message:
          type: string
          example: Schedule a meeting with John tomorrow at 2pm
        conversation_id:
          type: string
          example: conv-uuid-123
        user_id:
          type: string
          example: user-uuid-456
        context:
          type: object
          additionalProperties: true

    PostMessageResponse:
      type: object
      properties:
        conversation_id:
          type: string
          example: conv-uuid-123
        reply:
          type: string
          example: I can help you schedule that meeting. Let me propose creating an event for tomorrow at 2pm with John.
        proposed_action_summary:
          type: string
          example: Create calendar event "Meeting with John" on 2024-01-16 14:00-15:00
        action_id:
          type: string
          example: action_uuid-789
        correlation_id:
          type: string
          example: corr-uuid-abc
        metadata:
          type: object
          additionalProperties: true

    ConversationResponse:
      type: object
      properties:
        conversation_id:
          type: string
          example: conv-uuid-123
        user_id:
          type: string
          example: user-uuid-456
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        pending_actions:
          type: array
          items:
            $ref: '#/components/schemas/PendingAction'
        status:
          type: string
          enum: [active, closed, archived]
          example: active

    ChatMessage:
      type: object
      properties:
        id:
          type: string
          example: msg-uuid-001
        conversation_id:
          type: string
          example: conv-uuid-123
        user_id:
          type: string
          example: user-uuid-456
        role:
          type: string
          enum: [user, assistant, system]
          example: user
        content:
          type: string
          example: Schedule a meeting with John tomorrow at 2pm
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    PendingAction:
      type: object
      properties:
        id:
          type: string
          example: pa-uuid-001
        action_id:
          type: string
          example: action_uuid-789
        user_id:
          type: string
          example: user-uuid-456
        conversation_id:
          type: string
          example: conv-uuid-123
        proposed_action:
          type: object
          additionalProperties: true
          example:
            title: Meeting with John
            start_time: 1705413600
            end_time: 1705417200
        action_type:
          type: string
          example: create_event
        idempotency_key:
          type: string
          example: idem-key-xyz
        status:
          type: string
          enum: [pending, confirmed, cancelled, expired, failed]
          example: pending
        version:
          type: integer
          example: 1
        correlation_id:
          type: string
          example: corr-uuid-abc
        agent_metadata:
          type: object
          additionalProperties: true
        error_message:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    ActionResponse:
      type: object
      properties:
        action_id:
          type: string
          example: action_uuid-789
        action_type:
          type: string
          example: create_event
        proposed_action:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [pending, confirmed, cancelled, expired, failed]
          example: pending
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    ConfirmActionRequest:
      type: object
      required:
        - idempotency_key
      properties:
        idempotency_key:
          type: string
          example: idem-key-xyz

    ConfirmActionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Action executed successfully
        result:
          type: object
          additionalProperties: true
          example:
            event_id: event-uuid-123
            message: Event created successfully
        operation_id:
          type: string
          example: op-uuid-456

    ChatError:
      type: object
      properties:
        error:
          type: string
          example: Action not found
        code:
          type: string
          example: action_not_found
        details:
          type: string
          example: The specified action does not exist or has been deleted
