paths:
  /api/v1/chat/metrics:
    get:
      summary: Get chat service metrics
      tags:
        - Chat
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMetrics'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

  /api/v1/chat/actions/{action_id}/cancel:
    post:
      summary: Cancel a pending action
      tags:
        - Chat
      security:
        - BearerAuth: []
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
          description: Action ID
      responses:
        "200":
          description: Action cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Action cancelled successfully
        "404":
          description: Action not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        "409":
          description: Action already processed or not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        "410":
          description: Action expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

  /api/v1/chat/actions/{action_id}/confirm:
    post:
      summary: Confirm and execute a pending action
      tags:
        - Chat
      security:
        - BearerAuth: []
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
          description: Action ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmActionRequest'
      responses:
        "200":
          description: Action executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmActionResponse'
        "404":
          description: Action not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        "409":
          description: Action cannot be cancelled or processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        "410":
          description: Action expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

  /api/v1/chat/actions/{action_id}:
    get:
      summary: Get pending action details
      tags:
        - Chat
      security:
        - BearerAuth: []
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
          description: Action ID
      responses:
        "200":
          description: Action details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        "404":
          description: Action not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

  /api/v1/chat/conversations/{conversation_id}:
    get:
      summary: Get conversation history and pending actions
      tags:
        - Chat
      security:
        - BearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
          description: Conversation ID
      responses:
        "200":
          description: Conversation retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'

  /api/v1/chat/messages:
    post:
      summary: Send a chat message to the AI assistant
      tags:
        - Chat
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMessageRequest'
      responses:
        "200":
          description: Message processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostMessageResponse'
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
components:
  schemas:
    ChatMetrics:
      type: object
      properties:
        paths:
          type: number
        actions_per_minute:
          type: number
        messages_per_minute:
          type: integer
        conflict_errors:
          type: integer
        policy_violations:
          type: integer
        validation_errors:
          type: integer
        total_errors:
          type: number
        success_rate_pct:
          type: number
        confirmation_rate_pct:
          type: integer
        avg_action_latency_ms:
          type: integer
        avg_message_latency_ms:
          type: integer
        total_failed_actions:
          type: integer
        total_expired_actions:
          type: integer
        total_cancelled_actions:
          type: integer
        total_confirmed_actions:
          type: integer
        total_pending_actions:
          type: integer
        total_conversations:
          type: integer
        total_messages:
          type: integer
    ChatError:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
    ConfirmActionRequest:
      type: object
      properties:
        action_id:
          type: string
    ConfirmActionResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
    ActionResponse:
      type: object
      properties:
        action_id:
          type: string
        status:
          type: string
        error:
          $ref: '#/components/schemas/ChatError'
    ConversationResponse:
      type: object
      properties:
        conversation_id:
          type: string
        messages:
          type: array
          items:
            type: object
            properties:
              sender:
                type: string
              content:
                type: string
              timestamp:
                type: string
                format: date-time
        pending_actions:
          type: array
          items:
            type: object
            properties:
              action_id:
                type: string
              type:
                type: string
              status:
                type: string
                enum: [pending, confirmed, cancelled, expired]
              error:
                $ref: '#/components/schemas/ChatError'
    PostMessageRequest:
      type: object
      properties:
        conversation_id:
          type: string
        content:
          type: string
    PostMessageResponse:
      type: object
      properties:
        message_id:
          type: string
        status:
          type: string
          enum: [sent, failed]
        error:
          $ref: '#/components/schemas/ChatError'
