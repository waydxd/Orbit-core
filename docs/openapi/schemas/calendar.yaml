components:
  schemas:
    Event:
      type: object
      properties:
        id:
          type: string
          example: event-1
        user_id:
          type: string
          example: user-123
        title:
          type: string
          example: Team Meeting
        description:
          type: string
          example: Weekly sync meeting
        start_time:
          type: string
          format: date-time
          example: 2024-01-15T10:00:00Z
        end_time:
          type: string
          format: date-time
          example: 2024-01-15T11:00:00Z
        location:
          type: string
          example: Conference Room A
        hashtag:
          type: string
          example: "#meeting"
        is_recurring:
          type: boolean
          example: false
        recurrence_rule:
          type: string
          example: "FREQ=WEEKLY;INTERVAL=1"
        recurrence_exception:
          type: string
          example: "20240120T100000Z"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EventInput:
      type: object
      required:
        - title
        - start_time
        - end_time
        - user_id
      properties:
        title:
          type: string
          example: Team Meeting
        description:
          type: string
          example: Weekly sync meeting
        start_time:
          type: string
          format: date-time
          example: 2024-01-15T10:00:00Z
        end_time:
          type: string
          format: date-time
          example: 2024-01-15T11:00:00Z
        location:
          type: string
          example: Conference Room A
        hashtag:
          type: string
          example: "#meeting"
        is_recurring:
          type: boolean
          example: false
        recurrence_rule:
          type: string
          example: "FREQ=WEEKLY;INTERVAL=1"
        recurrence_exception:
          type: string
          example: "20240120T100000Z"
        user_id:
          type: string
          example: user-123

    Task:
      type: object
      properties:
        id:
          type: string
          example: task-1
        user_id:
          type: string
          example: user-123
        title:
          type: string
          example: Complete project documentation
        description:
          type: string
          example: Write comprehensive docs
        due_date:
          type: string
          format: date-time
          example: 2024-01-20T17:00:00Z
        completed:
          type: boolean
          example: false
        priority:
          type: string
          enum: [low, medium, high]
          example: high
        hashtag:
          type: string
          example: "#work"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskInput:
      type: object
      required:
        - title
        - due_date
        - user_id
      properties:
        title:
          type: string
          example: Complete project documentation
        description:
          type: string
          example: Write comprehensive docs
        due_date:
          type: string
          format: date-time
          example: 2024-01-20T17:00:00Z
        priority:
          type: string
          enum: [low, medium, high]
          example: high
        hashtag:
          type: string
          example: "#work"
        user_id:
          type: string
          example: user-123

    RecurringEvent:
      type: object
      properties:
        id:
          type: string
          example: event-uuid-456
        user_id:
          type: string
          example: user-uuid-789
        title:
          type: string
          example: Morning Run
        description:
          type: string
          example: Daily jog in the park
        location:
          type: string
          example: Central Park
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        is_recurring:
          type: boolean
          example: true
        recurrence_rule:
          type: string
          example: FREQ=WEEKLY;BYDAY=MO;UNTIL=20310102
        recurrence_exception:
          type: string
          example: 20240120T100000Z
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time