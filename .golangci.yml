version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - exhaustive
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nolintlint
    - revive
    - staticcheck
  settings:
    gocyclo:
      min-complexity: 15
    misspell:
      locale: US
    revive:
      confidence: 0.8
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
