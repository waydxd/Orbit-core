syntax = "proto3";

package hashtag;

option go_package = "github.com/waydxd/Orbit-core/pkg/hashtag/pb";

// HashtagService provides intelligent hashtag predictions for calendar events
service HashtagService {
  // PredictHashtags predicts relevant hashtags for the given event text
  rpc PredictHashtags(PredictRequest) returns (PredictResponse);

  // CollectData collects user feedback for incremental learning
  rpc CollectData(CollectDataRequest) returns (CollectDataResponse);

  // HealthCheck checks if the service is healthy
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
}

// PredictRequest contains the event text and prediction options
message PredictRequest {
  string event_text = 1;
  optional bool use_bart = 2;
  optional double threshold = 3;
}

// HashtagScore represents a hashtag with its confidence score
message HashtagScore {
  string hashtag = 1;
  double confidence = 2;
}

// PredictResponse contains the predicted hashtags
message PredictResponse {
  repeated string suggested = 1;
  repeated HashtagScore top_5 = 2;
  double inference_time_ms = 3;
  bool used_bart = 4;
}

// CollectDataRequest contains user feedback for incremental learning
message CollectDataRequest {
  int32 user_id = 1;
  string event_text = 2;
  repeated string selected_hashtags = 3;
  string timestamp = 4;
  string source = 5;
}

// CollectDataResponse confirms data collection
message CollectDataResponse {
  string status = 1;
  string message = 2;
  int32 samples_collected = 3;
}

// HealthRequest is empty
message HealthRequest {}

// HealthResponse contains service health information
message HealthResponse {
  string status = 1;
  string model_version = 2;
  int32 num_hashtags = 3;
  double f1_score = 4;
  string device = 5;
}

